<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027" />
      <stop offset="50%" stop-color="#1e3a45" />
      <stop offset="100%" stop-color="#2c5364" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#22c55e" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Rounded Background Card -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  
  <!-- Outer Neon Border -->
  <rect width="500" height="500" x="6" y="6" rx="114" fill="none" stroke="#22c55e" stroke-opacity="0.3" stroke-width="6"/>

  <!-- Shopping Bag & Cart Symbol -->
  <g filter="url(#glow)">
    <!-- Bag Handle -->
    <path d="M192 180 V136 C192 101 220.65 72 256 72 C291.35 72 320 101 320 136 V180" fill="none" stroke="url(#brandGrad)" stroke-width="28" stroke-linecap="round"/>
    
    <!-- Main Bag Body -->
    <path d="M136 170 H376 L398 396 C400 418 384 436 362 436 H150 C128 436 112 418 114 396 Z" fill="url(#brandGrad)"/>
    
    <!-- White Inner Details: Shopping Cart Lines / Logo -->
    <circle cx="210" cy="270" r="16" fill="#0f2027"/>
    <circle cx="302" cy="270" r="16" fill="#0f2027"/>
    <path d="M190 340 Q256 380 322 340" fill="none" stroke="#0f2027" stroke-width="20" stroke-linecap="round"/>
  </g>
</svg>
